<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Outer concentric ring -->
  <circle cx="40" cy="40" r="32"/>
  <!-- Middle ring -->
  <circle cx="40" cy="40" r="22"/>
  <!-- Inner ring -->
  <circle cx="40" cy="40" r="12"/>
  <!-- Center Bullseye -->
  <circle cx="40" cy="40" r="4" fill="#D4AF37"/>
  <!-- Target Dart / Arrow from top-right into center -->
  <line x1="62" y1="18" x2="44" y2="36" stroke-width="2.5"/>
  <!-- Dart flights / feathers -->
  <line x1="62" y1="18" x2="68" y2="12" stroke-width="2.5"/>
  <line x1="58" y1="14" x2="66" y2="22" stroke-width="2"/>
  <line x1="62" y1="10" x2="70" y2="18" stroke-width="2"/>
</svg>
