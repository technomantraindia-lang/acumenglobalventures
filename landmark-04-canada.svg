  <line x1="53" y1="65" x2="53" y2="70"/>
  <line x1="57" y1="65" x2="57" y2="70"/>
  
  <!-- Lower Pod Ring -->
  <path d="M 41 74 L 44 80 L 56 80 L 59 74"/>
  
