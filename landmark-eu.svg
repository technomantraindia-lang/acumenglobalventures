<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Quadriga / Goddess of Victory & Chariot on Top -->
  <circle cx="80" cy="14" r="3" fill="#D4AF37" stroke="none"/>
  <!-- Chariot Staff & Cross -->
  <line x1="84" y1="6" x2="84" y2="22"/>
  <line x1="81" y1="9" x2="87" y2="9"/>
  <!-- Winged Figure & 4 Horses -->
  <path d="M 76 18 C 76 14, 84 14, 84 18"/>
  <path d="M 68 22 C 70 16, 75 16, 78 22"/>
  <path d="M 82 22 C 85 16, 90 16, 92 22"/>
  <path d="M 60 25 L 68 22"/>
  <path d="M 100 25 L 92 22"/>
  <rect x="58" y="24" width="44" height="6" rx="1"/>

  <!-- Attic & Entablature (Roof structure) -->
  <rect x="42" y="30" width="76" height="12" rx="1"/>
  <!-- Metopes / Decorative panels -->
  <line x1="56" y1="30" x2="56" y2="42"/>
  <line x1="72" y1="30" x2="72" y2="42"/>
  <line x1="88" y1="30" x2="88" y2="42"/>
  <line x1="104" y1="30" x2="104" y2="42"/>

  <!-- Architrave Beam -->
  <rect x="36" y="42" width="88" height="6" rx="1"/>

  <!-- 6 Doric Columns (creating 5 passageways) -->
  <!-- Column 1 (Leftmost) -->
  <rect x="38" y="48" width="6" height="52"/>
  <!-- Column 2 -->
  <rect x="53" y="48" width="6" height="52"/>
  <!-- Column 3 -->
  <rect x="68" y="48" width="6" height="52"/>
  <!-- Column 4 -->
  <rect x="86" y="48" width="6" height="52"/>
  <!-- Column 5 -->
  <rect x="101" y="48" width="6" height="52"/>
  <!-- Column 6 (Rightmost) -->
  <rect x="116" y="48" width="6" height="52"/>

  <!-- Left and Right Wing Portals -->
  <path d="M 24 64 L 38 64 L 38 100 L 24 100 Z"/>
  <path d="M 122 64 L 136 64 L 136 100 L 122 100 Z"/>
  <line x1="24" y1="64" x2="38" y2="64"/>
  <line x1="122" y1="64" x2="136" y2="64"/>

  <!-- Stepped Podium Base -->
  <rect x="20" y="100" width="120" height="6" rx="1"/>
  <rect x="14" y="106" width="132" height="6" rx="1"/>
  <line x1="8" y1="112" x2="152" y2="112" stroke-width="3"/>
</svg>
