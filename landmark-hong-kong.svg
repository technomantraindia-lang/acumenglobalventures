<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 160" fill="none" stroke="#D4AF37" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- Bank of China Tower Twin Spires -->
  <line x1="52" y1="6" x2="52" y2="28" stroke-width="2.5"/>
  <line x1="68" y1="6" x2="68" y2="28" stroke-width="2.5"/>
  
  <!-- Slanted Peak / Top Module -->
  <polygon points="52,28 68,28 72,50 48,50"/>
  <!-- Top Diagonal Truss -->
  <line x1="52" y1="28" x2="68" y2="50"/>
  <line x1="68" y1="28" x2="52" y2="50"/>
  
  <!-- Upper Mid Tier -->
  <polygon points="48,50 72,50 78,85 42,85"/>
  <!-- Upper Diagonal Cross X -->
  <line x1="48" y1="50" x2="78" y2="85"/>
  <line x1="72" y1="50" x2="42" y2="85"/>
  <line x1="60" y1="50" x2="60" y2="85" stroke-width="1.8"/>

  <!-- Lower Mid Tier -->
  <polygon points="42,85 78,85 84,120 36,120"/>
  <!-- Lower Diagonal Cross X -->
  <line x1="42" y1="85" x2="84" y2="120"/>
  <line x1="78" y1="85" x2="36" y2="120"/>
  <line x1="60" y1="85" x2="60" y2="120" stroke-width="1.8"/>

  <!-- Base Tower Section -->
  <rect x="34" y="120" width="52" height="28"/>
  <line x1="34" y1="120" x2="86" y2="148"/>
  <line x1="86" y1="120" x2="34" y2="148"/>
  <line x1="60" y1="120" x2="60" y2="148" stroke-width="1.8"/>

  <!-- Side Buildings / Skyline accents -->
  <!-- Left mini tower -->
  <rect x="18" y="98" width="14" height="50"/>
  <line x1="18" y1="108" x2="32" y2="108"/>
  <line x1="18" y1="118" x2="32" y2="118"/>
  <line x1="18" y1="128" x2="32" y2="128"/>
  <line x1="18" y1="138" x2="32" y2="138"/>

  <!-- Right mini tower -->
  <rect x="88" y="90" width="16" height="58"/>
  <line x1="88" y1="102" x2="104" y2="102"/>
  <line x1="88" y1="114" x2="104" y2="114"/>
  <line x1="88" y1="126" x2="104" y2="126"/>
  <line x1="88" y1="138" x2="104" y2="138"/>

  <!-- Ground Foundation -->
  <rect x="10" y="148" width="100" height="6" rx="1"/>
  <line x1="4" y1="154" x2="116" y2="154" stroke-width="3"/>
</svg>
